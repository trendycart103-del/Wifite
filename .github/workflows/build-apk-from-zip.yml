name: Build Android APK From ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Find uploaded ZIP
      - name: Find Android Project ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # Step 3: Extract ZIP
      - name: Extract Android Project
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.findzip.outputs.zip }}" -d extracted

          echo "Extract completed"
          find extracted -name settings.gradle.kts

      # Step 4: Locate Android project
      - name: Locate Project Folder
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found!"
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # Step 5: Install Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Step 6: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 7: Install Android SDK 35
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # Step 8: Setup Gradle 8.9
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Step 9: Build Debug APK
      - name: Build Android APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon clean :app:assembleDebug

      # Step 10: Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WifiteSafeAndroid-Debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
